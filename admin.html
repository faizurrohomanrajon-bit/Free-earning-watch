HTML

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090e19">
<title>Free Earning Watch Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090e19;color:#fff;
 font-family:Arial,sans-serif;
}
header{
 padding:20px 15px;background:#111b2d;
 border-bottom:1px solid #25334a;
 position:sticky;top:0;z-index:10;
}
header h2{margin:0;color:#4ade80;font-size:20px}
header small{color:#94a3b8}
main{max-width:1050px;margin:auto;padding:14px}
.card{
 background:#131e31;border:1px solid #263650;
 border-radius:15px;padding:16px;margin:13px 0;
}
input,select{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #33445e;border-radius:9px;
 background:#0c1627;color:white;font-size:14px;
}
button{
 border:0;border-radius:8px;padding:11px 14px;
 background:#16a36a;color:white;font-weight:bold;
 margin:4px;cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#33445e}
.reject{background:#dc4545}
.approve{background:#16885b}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:9px;
}
.stat{
 background:#1c2b43;padding:13px 8px;
 border-radius:12px;text-align:center;
 min-width:0;
}
.stat strong{display:block;font-size:25px;margin:8px 0}
.stat small{color:#a9bad1;font-size:11px}
.green{color:#4ade80}
.blue{color:#60a5fa}
.purple{color:#c084fc}
.item{
 padding:14px 0;border-bottom:1px solid #34435b;
 overflow-wrap:anywhere;
}
.item:last-child{border:0}
.muted{color:#9eacc2;font-size:12px}
.section-title{font-size:17px;margin:0 0 12px}
.row{display:flex;gap:7px;flex-wrap:wrap}
.row button{flex:1}
.badge{
 display:inline-block;padding:5px 9px;
 border-radius:20px;background:#263750;
 font-size:11px;
}
.pending{color:#fbbf24}
.approved{color:#4ade80}
.rejected{color:#fb7185}
#dashboard{display:none}
#loginBox{max-width:420px;margin:70px auto}
#message{color:#fbbf24;font-size:13px}
.empty{color:#94a3b8;text-align:center;padding:20px}
.user-actions{margin-top:10px}
.history-line{padding:10px 0;border-bottom:1px solid #33445e}
.nav{
 display:flex;gap:6px;overflow-x:auto;
 margin:12px 0;
}
.nav button{white-space:nowrap;flex:1}
@media(max-width:480px){
 main{padding:10px}
 .card{padding:13px}
 .stats{gap:6px}
 .stat strong{font-size:21px}
 .stat small{font-size:10px}
}
</style>
</head>

<body>

<header>
 <h2>Free Earning Watch</h2>
 <small>Premium Admin Control Panel</small>
</header>

<main>

<div class="card" id="loginBox">
 <h2>Admin Login</h2>
 <p class="muted">Secure administrator access</p>
 <input id="email" type="email" placeholder="Admin Email">
 <input id="password" type="password" placeholder="Password">
 <button id="loginBtn" onclick="login()">Login</button>
 <p id="message"></p>
</div>

<div id="dashboard">

 <div class="card">
  <h3 class="section-title">Dashboard Overview</h3>

  <div class="stats">
   <div class="stat">
    <small>Total Users</small>
    <strong class="blue" id="users">0</strong>
   </div>

   <div class="stat">
    <small>New Users (24h)</small>
    <strong class="purple" id="newUsers">0</strong>
   </div>

   <div class="stat">
    <small>Online Now</small>
    <strong class="green" id="onlineNow">0</strong>
   </div>
  </div>

  <div class="row" style="margin-top:15px">
   <button onclick="loadDashboard()">Refresh Data</button>
   <button class="secondary" onclick="logout()">Logout</button>
  </div>
 </div>

 <div class="card">
  <h3 class="section-title">User Search</h3>

  <input id="userSearch"
   placeholder="Email অথবা User ID লিখুন">

  <button onclick="searchUsers()">Search Users</button>
  <button class="secondary" onclick="clearSearch()">Show All</button>

  <div id="userList">
   <p class="empty">Users loading...</p>
  </div>
 </div>

 <div class="card" id="historyCard" style="display:none">
  <h3 class="section-title">Points History</h3>
  <div id="historyList"></div>
  <button class="secondary" onclick="closeHistory()">Close History</button>
 </div>

 <div class="card">
  <h3 class="section-title">Withdrawal Management</h3>

  <div class="nav">
   <button onclick="loadWithdrawals('all')">All</button>
   <button onclick="loadWithdrawals('pending')">Pending</button>
   <button onclick="loadWithdrawals('approved')">Approved</button>
   <button onclick="loadWithdrawals('rejected')">Rejected</button>
  </div>

  <div id="withdrawalList">
   <p class="empty">Loading...</p>
  </div>
 </div>

</div>
</main>

<script>
const SUPABASE_URL =
"https://kzbvvkiepmyehwwdgvyf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xDYCus-WXDxyP2JT2aKajQ_64z8EZR_";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser = null;
let currentFilter = "all";

function $(id){
 return document.getElementById(id);
}

function safe(value){
 const el=document.createElement("span");
 el.textContent=value??"";
 return el.innerHTML;
}

function setMessage(text){
 $("message").textContent=text;
}

async function verifyAdmin(){
 const {data,error}=await db.rpc("is_admin");

 if(error || data!==true){
  await db.auth.signOut();
  currentUser=null;
  throw new Error("Admin access denied.");
 }
}

async function login(){
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email || !password){
  setMessage("Email ও Password লিখুন।");
  return;
 }

 $("loginBtn").disabled=true;
 setMessage("Checking...");

 try{
  const {data,error}=await db.auth.signInWithPassword({
   email,password
  });

  if(error) throw error;

  currentUser=data.user;

  await verifyAdmin();

  $("loginBox").style.display="none";
  $("dashboard").style.display="block";

  await loadDashboard();

 }catch(e){
  currentUser=null;
  setMessage(e.message);
 }finally{
  $("loginBtn").disabled=false;
 }
}

async function loadDashboard(){
 if(!currentUser)return;

 const {data,error}=await db.rpc("admin_dashboard_stats");

 if(error){
  alert("Dashboard error: "+error.message);
  return;
 }

 const stats=Array.isArray(data)?data[0]:data;

 if(stats){
  $("users").textContent=stats.total_users??0;
  $("newUsers").textContent=stats.new_users??0;
  $("onlineNow").textContent=stats.online_now??0;
 }

 await searchUsers();
 await loadWithdrawals(currentFilter);
}

async function searchUsers(){
 if(!currentUser)return;

 const query=$("userSearch").value.trim();

 $("userList").textContent="Loading...";

 const {data,error}=await db.rpc(
  "admin_search_users_v2",
  {p_search:query}
 );

 if(error){
  $("userList").textContent="Search error: "+error.message;
  return;
 }

 renderUsers(data||[]);
}

function renderUsers(users){
 const list=$("userList");
 list.replaceChildren();

 if(!users.length){
  list.innerHTML='<p class="empty">কোনো User পাওয়া যায়নি।</p>';
  return;
 }

 users.forEach(u=>{
  const div=document.createElement("div");
  div.className="item";

  const title=document.createElement("b");
  title.textContent=u.display_name||"Unknown User";

  const email=document.createElement("p");
  email.className="muted";
  email.textContent="Email: "+(u.email||"Not available");

  const uid=document.createElement("p");
  uid.className="muted";
  uid.textContent="User ID: "+u.user_id;

  const points=document.createElement("p");
  points.innerHTML="<span class='green'>Points: "+
   safe(u.balance_points)+"</span>";

  const created=document.createElement("p");
  created.className="muted";
  created.textContent="Joined: "+
   new Date(u.created_at).toLocaleString();

  const online=document.createElement("p");
  online.className="muted";

  if(u.last_seen_at){
   online.textContent="Last Online: "+
    new Date(u.last_seen_at).toLocaleString();
  }else{
   online.textContent="Last Online: Not available";
  }

  const amount=document.createElement("input");
  amount.type="number";
  amount.min="1";
  amount.step="1";
  amount.placeholder="পয়েন্ট সংখ্যা";

  const reason=document.createElement("input");
  reason.placeholder="কারণ (ঐচ্ছিক)";
  reason.maxLength=200;

  const add=document.createElement("button");
  add.textContent="Add Points";
  add.onclick=()=>adjustPoints(
   u.user_id,Number(amount.value),reason.value
  );

  const deduct=document.createElement("button");
  deduct.textContent="Deduct Points";
  deduct.className="reject";
  deduct.onclick=()=>adjustPoints(
   u.user_id,-Number(amount.value),reason.value
  );

  const history=document.createElement("button");
  history.textContent="Points History";
  history.className="secondary";
  history.onclick=()=>loadHistory(u.user_id);

  const actions=document.createElement("div");
  actions.className="user-actions";
  actions.append(amount,reason,add,deduct,history);

  div.append(
   title,email,uid,points,created,online,actions
  );

  list.appendChild(div);
 });
}

function clearSearch(){
 $("userSearch").value="";
 searchUsers();
}

async function adjustPoints(userId,change,reason){
 if(!Number.isSafeInteger(change) ||
    change===0 ||
    Math.abs(change)>1000000000){
  alert("সঠিক পয়েন্ট সংখ্যা লিখুন।");
  return;
 }

 const label=change>0?"যোগ":"কমানো";

 if(!confirm(Math.abs(change)+
  " পয়েন্ট "+label+" করবেন?"))return;

 const {data,error}=await db.rpc(
  "admin_adjust_points",
  {
   p_user_id:userId,
   p_points_change:change,
   p_reason:reason.trim()||"Admin adjustment"
  }
 );

 if(error){
  alert("Points পরিবর্তন হয়নি: "+error.message);
  return;
 }

 alert("নতুন Balance: "+data);

 await loadDashboard();
}

async function loadHistory(userId){
 $("historyCard").style.display="block";
 $("historyList").textContent="Loading...";

 const {data,error}=await db
  .from("points_history")
  .select("points_change,reason,created_at")
  .eq("user_id",userId)
  .order("created_at",{ascending:false})
  .limit(100);

 if(error){
  $("historyList").textContent=error.message;
  return;
 }

 const list=$("historyList");
 list.replaceChildren();

 if(!data.length){
  list.textContent="কোনো Points History নেই।";
  return;
 }

 data.forEach(item=>{
  const div=document.createElement("div");
  div.className="history-line";

  const amount=document.createElement("b");
  amount.style.color=
   item.points_change>0?"#4ade80":"#fb7185";

  amount.textContent=
   (item.points_change>0?"+":"")+
   item.points_change+" Points";

  const reason=document.createElement("p");
  reason.className="muted";
  reason.textContent=item.reason||"No reason";

  const date=document.createElement("small");
  date.className="muted";
  date.textContent=new Date(
   item.created_at
  ).toLocaleString();

  div.append(amount,reason,date);
  list.appendChild(div);
 });

 $("historyCard").scrollIntoView({
  behavior:"smooth"
 });
}

function closeHistory(){
 $("historyCard").style.display="none";
}

async function loadWithdrawals(filter="all"){
 if(!currentUser)return;

 currentFilter=filter;
 $("withdrawalList").textContent="Loading...";

 let query=db.from("withdrawals")
  .select("id,user_id,method,wallet,points,status,rejection_reason,created_at")
  .order("created_at",{ascending:false})
  .limit(200);

 if(filter!=="all"){
  query=query.eq("status",filter);
 }

 const {data,error}=await query;

 if(error){
  $("withdrawalList").textContent=
   "Withdrawal error: "+error.message;
  return;
 }

 const list=$("withdrawalList");
 list.replaceChildren();

 if(!data.length){
  list.innerHTML=
   '<p class="empty">কোনো Withdrawal Request নেই।</p>';
  return;
 }

 data.forEach(r=>{
  const div=document.createElement("div");
  div.className="item";

  const title=document.createElement("b");
  title.textContent="Withdrawal #"+r.id;

  const uid=document.createElement("p");
  uid.className="muted";
  uid.textContent="User ID: "+r.user_id;

  const details=document.createElement("p");
  details.textContent=
   "Method: "+r.method+
   " | Wallet: "+r.wallet+
   " | Points: "+r.points;

  const status=document.createElement("p");
  status.className="badge "+r.status;
  status.textContent=r.status.toUpperCase();

  const date=document.createElement("p");
  date.className="muted";
  date.textContent=new Date(r.created_at).toLocaleString();

  div.append(title,uid,details,status,date);

  if(r.rejection_reason){
   const reason=document.createElement("p");
   reason.className="muted";
   reason.textContent="Reject Reason: "+r.rejection_reason;
   div.appendChild(reason);
  }

  if(r.status==="pending"){
   const approve=document.createElement("button");
   approve.textContent="Approve";
   approve.className="approve";
   approve.onclick=()=>updateStatus(r.id,"approved");

   const reject=document.createElement("button");
   reject.textContent="Reject";
   reject.className="reject";
   reject.onclick=()=>updateStatus(r.id,"rejected");

   div.append(approve,reject);
  }

  list.appendChild(div);
 });
}

async function updateStatus(id,status){
 let reason=null;

 if(status==="rejected"){
  reason=prompt("Reject করার কারণ লিখুন:");

  if(!reason||!reason.trim()){
   alert("Reject করার কারণ লিখতে হবে।");
   return;
  }
 }

 if(!confirm(
  status==="rejected"
   ?"Request Reject এবং সম্পূর্ণ Points Refund করবেন?"
   :"Withdrawal Approve করবেন?"
 ))return;

 const {data,error}=await db.rpc(
  "admin_process_withdrawal",
  {
   p_withdrawal_id:id,
   p_status:status,
   p_rejection_reason:reason
  }
 );

 if(error){
  alert("Request Process হয়নি: "+error.message);
  return;
 }

 alert(data);
 await loadDashboard();
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;

 $("dashboard").style.display="none";
 $("loginBox").style.display="block";
 $("password").value="";
 setMessage("Logout successful.");
}

// Search with Enter key
$("userSearch").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchUsers();
});

// Restore an existing admin session
async function restoreSession(){
 const {data,error}=await db.auth.getSession();

 if(error||!data.session)return;

 currentUser=data.session.user;

 try{
  await verifyAdmin();

  $("loginBox").style.display="none";
  $("dashboard").style.display="block";

  await loadDashboard();
 }catch(e){
  setMessage(e.message);
 }
}

restoreSession();

</script>
</body>
                            </html>
